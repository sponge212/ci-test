name: My Second CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # این دستور کدهای گیت‌هاب شما را روی سرور مجازی دانلود می‌کند
      - name: Get Code from Repo
        uses: actions/checkout@v4
      
      # حالا که کدها دانلود شدند، لیست فایل‌ها را نشان می‌دهیم
      - name: List Files
        run: |
          echo "These are the files in my repository:"
          ls -la
      
      # نمایش تاریخ و زمان سرور
      - name: Print Current Date
        run: date
